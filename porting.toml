procedure = ["按官方对应porting子系统文档，先来源与接口核对，再编译/打包门禁，最后实机验证。"]
findings = ["当前CPU GOP路径，不选择Adreno740/AdrenoMetal；本机为MSM8998。", "A540 硬件清点：GPU 0x05000000/0x40000、SMMU 0x05040000/0x10000（bank0=0x8000、SID0）、GPUCC 0x05065000、GCC GPU CBCR 0x71004/0x71010/0x71028；固件 a530_pfp.fw、a530_pm4.fw、a540_gpmu.fw2、a540_zap.* 已从 vendor 分区只读取得并记录哈希（不随仓库分发）。", "只读探针（内核 dd0e4ad9，20261031T050242Z）：GCC GPU AHB/BIMC 已开、GPUCC 可读，但 CX GDSC（0x1008 bit31）与 GX（0x1094 bit31）均未上电、gfx3d/rbcpr/rbbmtimer/isense 分支 halted，GPU/SMMU 未访问。", "固件 ClockDxe 提供 EFI_CLOCK_PROTOCOL（GUID 241AFAE6-885F-4F6C-A7EA-C28EAB79C3E5），含 VDD_GPU_CX/GX、GPU SMMU 与全部 GPUCC 时钟名，可作为上电入口。", "实机 EFIClock 清点（ver=0x10005）：VDD_GPU_CX/GX 与 VDD_HLOS1/2_GPU_SMMU 域 ID 均可解析；gcc_gpu_cfg_ahb_clk 75 MHz 在跑；gpucc_gfx3d_clk/rbcpr/rbbmtimer/isense 均关闭、19.2 MHz。", "EFIClock 上电序列在实机全部成功（CX/GX 域、四个 GPUCC 时钟、gfx3d 257 MHz、两个 SMMU 域）；上电后 UEFI 直接读 GPUCC 会触发 synchronous exception（UEFI 映射不可用），去掉读取后同一序列可正常启动并自动回 Recovery（capture P:done）。", "XNU 映射读取成功（镜像 d11f9305，日志 20261031T062615Z）：stage=3 flags=f，CX/GX/gfx3d 均在线；GPU RBBM_ID=0x00010042、rev=0xb5f00000、Status=1、MEControl=0x303（CP halted）、GPMU 未加载。", "SMMU 读取成功（镜像 9ebb59f6，日志 20261031T063813Z）：在 UEFI 使能 gcc_hlos1/2_gpu_smmu_clk 后，XNU 读到 SCTLR=0x00200626（未使能）、ID0=0x48016403、ID1=0x20008003、ID2=0x00007511、SMR0=0、S2CR0=0x000200ff、CB0 全 0；SMMU 可访问、尚未配置。", "SMMU 上下文已建立（镜像 a2ddc42f，日志 20261031T065735Z）：4 KiB 空根表 root=0x1606cf000，CB0 SCTLR=0x1167、TCR=0x802018、SMR0=0x80000000、S2CR0=0、FSR=0x400（AArch64 格式），两次 TLB 同步成功。", "叶子映射已验证（镜像 b2404510，日志 20261031T071612Z）：4 KiB buffer 映射到 GPU VA 0x1000000，PTE=0x6000015fad9e43，TLB 同步通过；尚无 GPU DMA。", "综合探针（镜像 67449462/8037ae34）：QGFW 固件解析成功（PM4 19648、PFP 16816、GPMU 2947 words），五个 buffer 分配成功；通用 walker 在 ring 多页映射仍返回 st=5，而同轮单元映射 SMAP=0。已加逐页/逐级诊断；下一步改用独立根表并读取 CP/安全状态。", "整屏黑根因已定位：对照关闭 GPU 上电（270928d3）显示恢复；仅跳过 SetClockFreqHz(gpucc_gfx3d_clk,257MHz)（ca8d45f0）时显示正常、GPU0 stage=3 flags=f、67 轮运行。黑屏是 gfx3d 频率/PLL 改动导致，不是 CP 或系统卡死；此前 CP 探针轮的黑屏均含这一步。", "进一步隔离（7ee28350）：rate=0、只做 SMMU setup（cp=0）可进入桌面并自动回 Recovery，说明 SMMU 上下文安全；CP 探针（buffer 映射/状态）是剩余黑屏变量。早期 UFS 注册钩子过导致日志仅 1 轮，已回退。下一步每 buffer 映射后延时落盘，取 MAPD 失败级别。"]
