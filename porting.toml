schema_version = 1
[device]
name = "cheeseburger"
soc = "MSM8998"
os_profile = "ipados-17.7.11-21H461"
summary = "iPadOS 17.7.11 desktop on hardware with working touch (543 HID reports, user-confirmed), 8 CPUs and 2 GiB; display first frame is intermittent and its CPU scanout is being optimised; GPU, network, audio and power are not started."

