procedure = ["按官方对应porting子系统文档，先来源与接口核对，再编译/打包门禁，最后实机验证。"]
findings = ["当前CPU GOP路径，不选择Adreno740/AdrenoMetal；本机为MSM8998。", "用户态提交链路实机验证（P21-Linnet，boot 0x477aef4e，日志 out/p21/persistent-logs/20261104T110602Z）：客户端分配/映射两个 BO，A540 CP 执行其 IB，目标 BO 得到 adc0de1/feed0002/600d0003，fence 完成并被等待，CPU 回读一致、解映射与释放 err=0；客户端自检 v4（4/4）。仍无渲染/IOSurface/Metal，显示为 CPU 合成。", "停 CP 根因：ZAP 之后向 RBCCU/SP 重写 0x778000 上电命令会在 1 ms 内停住 CP，随后踢门铃引发 unclassified kernel abort（P21-Quail）；该写入已限制为 reset 前唯一一次，其余采样只读。", "空 IB（首个 buffer 无非零 dword）不会被本 CP 执行且不产生 fence，现改为在 CPU 上完成整笔提交。", "本机 VBIF_HALT(0x3080) 空闲读 0xf0000：bits19:16 为每客户端状态、bits3:0 才是请求，整寄存器与 0 比较永不成立。", "GPU 像素上屏（P21-Oriole）：4 条 24 行×448 像素条带由 CP_MEM_WRITE 写入 PE_current_console() 的固件扫描缓冲，24 个 IB 全部 fence 完成、中点回读 ff00ff00，用户目视确认；扫描线映射必须在提交锁之外完成（Skua 的 IOLock 自锁教训）。", "Turnip Darwin-KMD 构建链已恢复（2026-11-04）：Mesa 85fda3b3 + 官方 9 补丁，host 22.9 MB / ios 17.9 MB 均构建成功；Turnip 官方不支持 A5xx，Darwin KMD 只解决与 NativeAdreno 服务通信，A540 绘制需自建后端。", "服务端按 tu_knl_darwin.cc 补齐：NTNL tunnel（magic 0x4e544e4c，探测 0xffffffff）、BoAlloc 接受 contiguous=0、BoImport 钉调用方页并按物理段映射、提交期持有 BO 至 fence 完成（held/freeBo 拒绝）。", "A540 拷贝路径：Encoder540::copy 用 CP_MEM_TO_MEM；本机一批超过约 4 个 0x73 包会停止（2 个后无 fence，加屏障无效），更大拷贝须拆提交。", "低池 BO 是 32 KiB 块中的一页，内核视图必须取块基址+页偏移；只用 getBytesNoCopy() 会指向错误页并掩盖客户端写入。", "A540 硬件清点：GPU 0x05000000/0x40000、SMMU 0x05040000/0x10000（bank0=0x8000、SID0）、GPUCC 0x05065000、GCC GPU CBCR 0x71004/0x71010/0x71028；固件 a530_pfp.fw、a530_pm4.fw、a540_gpmu.fw2、a540_zap.* 已从 vendor 分区只读取得并记录哈希（不随仓库分发）。", "只读探针（内核 dd0e4ad9，20261031T050242Z）：GCC GPU AHB/BIMC 已开、GPUCC 可读，但 CX GDSC（0x1008 bit31）与 GX（0x1094 bit31）均未上电、gfx3d/rbcpr/rbbmtimer/isense 分支 halted，GPU/SMMU 未访问。", "固件 ClockDxe 提供 EFI_CLOCK_PROTOCOL（GUID 241AFAE6-885F-4F6C-A7EA-C28EAB79C3E5），含 VDD_GPU_CX/GX、GPU SMMU 与全部 GPUCC 时钟名，可作为上电入口。", "实机 EFIClock 清点（ver=0x10005）：VDD_GPU_CX/GX 与 VDD_HLOS1/2_GPU_SMMU 域 ID 均可解析；gcc_gpu_cfg_ahb_clk 75 MHz 在跑；gpucc_gfx3d_clk/rbcpr/rbbmtimer/isense 均关闭、19.2 MHz。", "EFIClock 上电序列在实机全部成功（CX/GX 域、四个 GPUCC 时钟、gfx3d 257 MHz、两个 SMMU 域）；上电后 UEFI 直接读 GPUCC 会触发 synchronous exception（UEFI 映射不可用），去掉读取后同一序列可正常启动并自动回 Recovery（capture P:done）。", "XNU 映射读取成功（镜像 d11f9305，日志 20261031T062615Z）：stage=3 flags=f，CX/GX/gfx3d 均在线；GPU RBBM_ID=0x00010042、rev=0xb5f00000、Status=1、MEControl=0x303（CP halted）、GPMU 未加载。", "SMMU 读取成功（镜像 9ebb59f6，日志 20261031T063813Z）：在 UEFI 使能 gcc_hlos1/2_gpu_smmu_clk 后，XNU 读到 SCTLR=0x00200626（未使能）、ID0=0x48016403、ID1=0x20008003、ID2=0x00007511、SMR0=0、S2CR0=0x000200ff、CB0 全 0；SMMU 可访问、尚未配置。", "SMMU 上下文已建立（镜像 a2ddc42f，日志 20261031T065735Z）：4 KiB 空根表 root=0x1606cf000，CB0 SCTLR=0x1167、TCR=0x802018、SMR0=0x80000000、S2CR0=0、FSR=0x400（AArch64 格式），两次 TLB 同步成功。", "叶子映射已验证（镜像 b2404510，日志 20261031T071612Z）：4 KiB buffer 映射到 GPU VA 0x1000000，PTE=0x6000015fad9e43，TLB 同步通过；尚无 GPU DMA。", "综合探针（镜像 67449462/8037ae34）：QGFW 固件解析成功（PM4 19648、PFP 16816、GPMU 2947 words），五个 buffer 分配成功；通用 walker 在 ring 多页映射仍返回 st=5，而同轮单元映射 SMAP=0。已加逐页/逐级诊断；下一步改用独立根表并读取 CP/安全状态。", "整屏黑根因已定位：对照关闭 GPU 上电（270928d3）显示恢复；仅跳过 SetClockFreqHz(gpucc_gfx3d_clk,257MHz)（ca8d45f0）时显示正常、GPU0 stage=3 flags=f、67 轮运行。黑屏是 gfx3d 频率/PLL 改动导致，不是 CP 或系统卡死；此前 CP 探针轮的黑屏均含这一步。", "进一步隔离（7ee28350）：rate=0、只做 SMMU setup（cp=0）可进入桌面并自动回 Recovery，说明 SMMU 上下文安全；CP 探针（buffer 映射/状态）是剩余黑屏变量。早期 UFS 注册钩子过导致日志仅 1 轮，已回退。", "CP 多页 SMMU 映射已通过（镜像 a4af3b18，日志 20261031T095634Z）：ring/PM4/PFP 映射 r=0、MAPD ret=0 tlb=0；gpmu/fence 映射与 GCP2 CP 状态因提前返回未执行。下一步同镜像等 ≥200 s 取完整 CP 状态。", "五个 buffer 全部映射通过（镜像 57036564，内核 aeb7b438，日志 20261031T103113Z，boot 0x50b0c185）：ring/PM4/PFP/gpmu(3 页)/fence 均 r=0、tlb=0，GCP3 五个 GPU VA 齐备。此前第 4 个映射后整机停住的问题未再出现；本轮差异是 SMMU 寄存器窗口整轮只映射一次（此前每次 buffer 映射都新建 IOMemoryMap）并把 CP 状态读取提前。", "CP/GPMU 冷状态：me=0x303（CP halted）、vbif=0/0xf0000、rb=0/0/0/0、Status=0x800001c1（与 sagit haltedPipelineIdle 掩码 0x800001c1 完全一致）、irq=0、TrustControl=1、SECVID TSB base=0；GPMU ready=0/error=0、CM3_SYSRESET=1、CP_PROTECT_CNTL=0、RBBM_SW_RESET_CMD=0、RBBM_AHB_CNTL0=1。", "同一轮显示与系统正常（DISPLAY clients=129 frames=6、SWAP transfer=6），内核跑满 400 s 后 AUTORESET issued=1 自动回 Recovery，说明 SMMU 映射探针不再导致整屏黑/停住。", "CP reset/configure/start 已实机执行（镜像 64fdf3d6，内核 e2e767c0，日志 20261031T104613Z，boot 0x5121380b）：reset/configure 通过、VBIFHalted&15=0xf、ME_INIT 已写入 ring（WPTR=9），但 RBRead 始终为 0（rc=-4 kick 超时），CPInterruptStatus/InterruptStatus 全 0，Status=0xc00003c1（仅多 bit30），说明 CP 已唤醒但未取 ring、无错误中断。", "待验证的下一假设：冷状态 TrustControl=1（secure 模式）阻止 CP 执行非安全微码；sagit 提交前提要求 TrustControl==0，Linux a5xx 在无 ZAP 时写 RBBM_SECVID_TRUST_CNTL=0 退出安全模式。同时 CB0 SCTLR 由 0x1167 改为 sagit 实测的 0x1027（无 CFIE/HUPCF），并捕获 CP_HW_FAULT/CP_PROTECT_STATUS/CP_AHB_FAULT 与 SMMU CB0_FSR/GFSR。", "供电轮（镜像 b15bb427，日志 20261031T111210Z，boot 0x5230df48）整屏黑：启动时 GPUCC cx=80001fe0 gx=a0222000 gfx=621 均在线，begin 日志 151.73 s，最后内核消息 157.33 s，冻结发生在 8 s 等待中、未执行任何 GPU 写；同窗口系统 PMRD 正在做 PowerChangeOverride/idle sleep timer 切换，上两轮在 ~188 s（PMRD 之后）执行均稳定。下一轮将 GPU 探针与 CP 启动提前到 ~75–120 s 以避开该窗口。", "提前执行轮（镜像 aea9a9fa，内核 6ccfb681，日志 20261031T112909Z，boot 0x510ea570，8 rounds）：76.7 s SMMU cb=1027/fsr=400、五映射全通（86.7–98.7 s，r=0 tlb=0）；98.7258 s 打印 begin 后无任何控制台行，reset 尚未执行（先 8 s 等待）；设备最终在 Recovery 被发现且用户确认是手动返回，400 s 自动复位未生效。99 s 轮 PMRD 活动在 69–72 s 已结束，PMRD 归因可排除；当前无法区分内核停住与仅控制台/日志捕获停住（auto-reset 自身也要 IOLog）。新相关性：中断轮 begin 行为 6 参数长行、正常轮为 3 参数短行，下一轮先验证控制台长行/锁假设并加不依赖 console/UFS writer 的存活标记。", "P0 证据冻结已完成（2026-10-31）：preboot-gate 每次写 gate-<UTC>.json 并校验 packaging 指向本候选镜像；新增 scripts/p21-freeze-round.py；最新轮产物冻结在 out/p21/gpu-cp/rounds/20261031T114334Z-cp-early2（镜像/内核/固件/payload/ADT/配置副本 + gate/pins/boot/monitor/retrieval），5 个历史轮以哈希补录并建 INDEX.md；旧 offline-gate.json/pins.json 已标记失效。", "P1 reset 失败路径已收口：CheeseburgerGpuStart.h 模板化 reset/configure/start，失败统一保持 halt、标记 abandoned、不再 unhalt/kick；host 寄存器模型 8 用例（含各失败点与 kick 超时）8/8 通过，记录 out/p21/gpu-cp/host-tests/20261031T115416Z；内核用新模板重编通过（native fb78e5c4，未打包/未启动）。", "P2 可观察性与 A/B 完成：CBHB 心跳环（31 块/10 s，独立线程直写，auto-reset mark/smc，reset 每步标记），codec 8/8；A/B/C 三轮均 66 rounds 自动复位，B/C 心跳同型（tick 28–308、mark 329、smc 333），行长/映射/console/睡眠不触发停住；此前中断更可能在 full-start reset 写入阶段。", "D 轮逐步心跳（boot 0x51e9e4e1）定位：reset 到 cm3 后卡在 RBBM_SECVID_TRUST_CNTL 写/回读（无 trust 标记），tick 继续到 ~370 s，内核/UFS 活、console 路径受阻；强制退出 secure 模式已改为默认关闭（显式 cheeseburger-gpu-trust-clear=1），写/读拆分 trustw/trustwr/trust 标记，host 9/9。", "E 轮（boot 0x50edef20）：不写 TRUST_CNTL 的 full-start 稳定，67 rounds 自动复位无黑屏；GCP5 rc=-4 r=0 w=9、GCP6 trust=1、CP/SMMU fault 均 0。证明 D 的卡死源是该寄存器写/回读，去掉后路径安全；secure 未清时 CP 仍不取 ring，下一步补 GCP8/GCP9 只读回读并核对 ZAP/PAS。", "F 轮（boot 0x5121fa54）：GCP8 证明 ME/PFP/RB 基址、RB_CNTL、CP_ADDR_MODE、CP_PROTECT_CNTL 回读正确；GCP9 SCTLR/TCR/SMR/TTBR0 低字正确，TTBR0 高字回读 1 与 S2CR 打印异常待分高低字重测；PTE 查询少下潜一级已修；CP 仍 r=0、trust=1、无 fault。", "第一轮合并修正（boot 0x51cd61ff）：TTBR hi=1 由 root PA>4 GiB 解释、S2CR 原始 0、叶子 PTE 指向 ring PA；reset/configure/页表/stream 自洽；心跳分区/过滤/gaps 正常；RPTR=0 无 fault。已确认 ZAP/PAS 缺失（DTB qcom,zap-shader/ga540_zap，sagit 用 PAS-13，本机无链路）；下一步移植 PAS/ZAP（建议 XNU 端口，先 host 测试）。", "PAS availability 探针（boot 0x52c594dc）：st=0 smc64=1，init/setup/auth/shutdown 均可用，sup=0 非授权结果；XNU EL1 可直达 PAS。ZAP loader 已实现（CheeseburgerZap.h + CheeseburgerGpuPas.cpp）：按 ELF 动态解析，metadata=0x94 头+0x1988 hash=0x1A1C，唯一可装载段 ph2（0x5000/0x1334，可重定位）来自 .b02，region=0x2000、1 MiB 对齐；init(metadata_pa)→setup(region_pa,0x2000)→拷贝→clean→auth，失败 fail-closed 且不 reset CP；宿主模型 61 项含真实固件。首轮实机（boot 0x79802690，镜像 395384a0）：init 与 mem_setup 均返回 x0=0，接受 >4 GiB 的 40 位物理区（metadata 0x10a257000、region 0x111300000）；本地 imageInto 误用 32 位目的地上限导致 rc=-112，已改 40 位；CP 未 reset、显示正常、400 s 自动回。", "小米 6 公开源码已拉到独立参考目录 upstream/ios_sagit，commit 673f85070fe9f7872793015eb230a5c3987d4a8c（2026-11-03，MIT/BSD-2-Clause，Mesa 24.3.4 IR3 参考）；QcomGPU/QcomMTL 为完整 A540 native Metal 栈，本机只复用其 A5xx 编码与状态序列，不套用 sagit 的板级地址/启动链。", "A540 图形路径（P21-Bittern 源码）：CheeseburgerGpuBlit540.h 按 sagit AdrenoPipeline.h 的 clearRows/restore 逐寄存器移植 RB/GRAS 2D 引擎（BLIT2D 0x6c=5、CP_BLIT 0x2c、R32_UINT 75、色缓存 flush 29 + CP_WAIT_REG_MEM），A5xxRegs.h 由 Mesa a5xx.xml 生成；实机 P21-Bittern（boot 0x409f33da，日志 20261104T170051Z）：rc=0 seq=8 words=491，四象限回读 px=ff102030/ff405060/ff8090a0/ffb0c0d0、边缘样本 ff102030、match=4/4，证明 A540 RB/GRAS 2D 引擎执行并写出目标；扫描线带本轮未尝试（scan=0/0），不声明面板像素。", "服务端生命周期（P21-Bittern 源码）：BoImport 后 BoMap 允许无自有 buf 的导入 BO；提交前预留 job 槽并把本客户端所有已映射 BO 的全局 serial 计入持有表，fence 完成才释放；客户端异常关闭时把未能释放的对象移入可追踪 quarantine，fence 消失且引擎 idle 后再 unmap/complete/release；失败提交保留全部持有（fail-closed）。", "A5xxRegs.h 生成源为本机 Mesa 26.2 a5xx.xml（与 sagit 的 Mesa 24.3.4 同名寄存器偏移一致）；Mesa 26 把 RB_2D_SRC/DST_LO/HI 与 UCHE_CACHE_INVALIDATE_MIN/MAX 合并为 reg64，头文件保留旧名别名。", "显示扫描线约束（P21-Curlew，boot 0x40a26751）：固件 GOP 为 1080x1920、pitch=4320 字节；A5xx 2D 的 RB_2D_*_SIZE.PITCH 以 64 字节为单位，4320 不可编码（prep=-5，pe=1080/1920/4320/32），因此 2D 引擎不能直接写这块扫描线。", "MDP 直接扫描约束（P21-Dunlin，boot 0x40a433bd）：GPU 全帧 1088x1920/pitch 4352 分配成功但 PA=0x111876000（4.58 GiB），MDP5 PIPE_SRC0_ADDR 为 32 位，flip 钩子安全跳过（rc=-1），未改显示状态；可见 GPU 输出需要 compute shader 的字节寻址写入或低 4 GiB 连续帧/IOMMU 扩展。", "sagit snapshot2D 的 2D 拷贝已实现（copySetup/copyTile/copyEnd）：RB_2D_BLIT_CNTL=0x86000000、UNKNOWN_2184=9、独立源/目标 pitch、sourced CP_BLIT；宿主模型覆盖编码、边界、失败关闭，实机受上述 pitch 约束尚未上屏。", "IR3 工具链（P21-Egret）：本机 Mesa 26.2 ir3_parse_asm + gpu_id=540 可产出 a5xx 机器码；scan_band/probe 两个 shader 的 32 字 ISA 与元数据（instrlen=1、constlen=0、max_reg=1、localid=0、wgid=252、double_threadsize=1）已嵌入 CheeseburgerGpuCompute540.h，源码与汇编说明在 tools/gpu-ir3/。", "compute 下发（P21-Egret/Gannet）：按 sagit dispatch 下发 restore→CS 配置→shader object→SSBO 描述符(state block 15)→NDRANGE→CP 0x33→flush(4)。实机 rc=0、fence 完成（seq 9..12，words=360），但自有 4 KiB SSBO 的常量/shift 探针都读回 0，扫描带也仍是 ff000000；dispatch 后 GPU 状态 bit30 置位（非 idle），用户提交链仍 err=0。结论：不是 GOP 地址/pitch 问题，CS 未写或未完成，下一步用延时二次读取与状态变体矩阵定位。", "compute 根因（P21-Lapwing，boot 0x4229114e）：ZAP 前 RBCCU/SP 域 status bit20=1（after=140000/140001），ZAP 后回落为 1（bit20=0）；2D 不依赖 SP、一直正常，而 CS 需要 SP，因此 7 个状态变体（sagit/ids0/thr0/nobuf/one/sb14/cnt1）全部 rc=0 但自有 SSBO 无写入（立即与 20 ms 后都为 0）。", "核心域 resume 尝试（P21-Petrel/Plover）：按 sagit idlePowerTransition 在空 ring 上 halt CP/VBIF→写 0xa887/0xa881=0x778000→恢复；Petrel 空闲判定误用 st&~1 返回 -3（正常 idle 是 0x80000101/0x800001c1）；Plover 修正后系统挂住（19:11:30Z 启动，455 s 后无 ADB/Fastboot，日志待回收）。该路径已改为仅 cheeseburger-gpu-core-resume=1 时执行，默认关闭。", "P21-Plover 挂死结论