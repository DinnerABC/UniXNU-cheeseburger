procedure = ["按官方对应porting子系统文档，先来源与接口核对，再编译/打包门禁，最后实机验证。"]
findings = ["官方 format2 四层配置解析成功，本地SoC override如实标记未发布；构建guard仍开启。"]
completion = ["所选实现及全部板级依赖具有可重复构建记录与明确硬件证据等级。"]
limits = ["本记录描述迁移目标；planned不否认历史阶段已有实现，也不把历史结果冒充新源码验证。"]
